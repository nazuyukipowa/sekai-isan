<div class="shell">

    <a href="#/" class="brand"><span class="brand-mark"></span>世界遺産学習帳<small>World Heritage</small></a>
    <nav id="nav">
      <a href="#/" data-route="" class="nav-today">今日の学習<span class="nav-count" id="nav-today"></span></a>
      <div class="nav-group"><span class="step-no">壱</span>読む</div>
      <a href="#/sites" data-route="sites">遺産一覧</a>
      <a href="#/map" data-route="map">地図</a>

      <div class="nav-group"><span class="step-no">弐</span>覚える</div>

  </aside>
  <main id="app"></main>
